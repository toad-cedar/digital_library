volumes:
  pg-data:
    driver: local
  redis-data:
    driver: local
  es-data:
    driver: local
  minio-storage:
  minio-config:

networks:
  app-network:
    driver: bridge

services:
  postgres:
    image: postgres:18.3-alpine3.23
    container_name: postgres
    env_file: ./.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - app-network
    command: >
      postgres -c max_connections=100
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB 
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped


  redis:
    image: redis:8.6.2-alpine
    container_name: redis
    volumes:
      - redis-data:/data
    networks:
      - app-network


  # Объектное хранилище
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-storage:/data
      - minio-config:/root/.minio
    networks:
      - app-network
    command: server /data --console-address ":9001"
    healthcheck:  
      test: ["CMD", "curl", "-f", "${MINIO_ENDPOINT}/minio/health/live"] 
      interval: 30s  
      timeout: 20s  
      retries: 3
    restart: unless-stopped


  elasticsearch:
    image: elasticsearch:9.2.2
    container_name: elasticsearch
    
    environment:
      - node.name=elasticsearch
      - cluster.name=es-cluster
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.http.ssl.enabled=false
      - xpack.security.enabled=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 20s
      timeout: 10s
      retries: 5
  
  # Запускается только один раз
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      /bin/sh -c "  
      /usr/bin/mc alias set myminio ${MINIO_ENDPOINT} ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/uploads || true;
      /usr/bin/mc mb myminio/covers || true;
      /usr/bin/mc anonymous set public myminio/uploads || true;
      /usr/bin/mc anonymous set public myminio/covers || true;
      exit 0;
      "
  
  # Антивирус
  clamav:
    image: clamav/clamav:stable
    container_name: clamav
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G 

