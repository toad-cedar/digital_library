volumes:
  pg-data:
    driver: local
  redis-data:
    driver: local
  es-data:
    driver: local
  minio-storage:
  minio-config:
  clamav-data:

networks:
  app-network:
    driver: bridge
    internal: false
  internal-network: # изолированная сеть для критичных сервисов
    driver: bridge
    internal: true   

services:
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.worker
    env_file: ./.env
    environment:
      - REDIS_HOST=redis
      - DB_HOST=postgres
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      tika:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped


  tika:
    image: apache/tika:4.0.0-SNAPSHOT-full
    container_name: tika_server
    ports:
      - "9998:9998"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9998')\""]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped


  postgres:
    image: postgres:18.3-alpine3.23
    container_name: postgres
    ports:
    - "5432:5432"
    env_file: ./.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - app-network
    command: >
      postgres -c max_connections=100
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB 
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped


  redis:
    image: redis:8.6.2-alpine
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped


  # Объектное хранилище
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-storage:/data
      - minio-config:/root/.minio
    networks:
      - app-network
    command: server /data --console-address ":9001"
    healthcheck:  
      test: ["CMD", "curl", "-f", "${MINIO_ENDPOINT}/minio/health/live"] 
      interval: 30s  
      timeout: 20s  
      retries: 3
    restart: unless-stopped


  elasticsearch:
    image: elasticsearch:9.2.2
    container_name: elasticsearch
    restart: unless-stopped
    ports:
    - "127.0.0.1:9200:9200" # 
    environment:
      - node.name=elasticsearch
      - cluster.name=es-cluster
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.http.ssl.enabled=false
      - xpack.security.enabled=true
      - network.host=0.0.0.0
      - http.host=0.0.0.0
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - app-network
      - internal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "elastic:${ELASTIC_PASSWORD}", "http://localhost:9200/_cluster/health"]
      interval: 20s
      timeout: 10s
      retries: 5

  # Запускается только один раз
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      /bin/sh -c "  
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/uploads || true;
      /usr/bin/mc mb myminio/covers || true;
      /usr/bin/mc anonymous set public myminio/uploads || true;
      /usr/bin/mc anonymous set public myminio/covers || true;
      exit 0;
      "

  # Антивирус
  clamav:
    image: clamav/clamav:stable
    container_name: clamav
    restart: unless-stopped
    environment:
      - CLAMAV_NO_FRESHCLAMD=false  # разрешаем автообновление сигнатур
    ports:
      - "127.0.0.1:3310:3310"  # если нужно подключаться извне
    networks:
      - app-network
    volumes:
      - clamav-data:/var/lib/clamav  # сохраняем базы вирусов
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "clamdscan", "--ping"]
      interval: 60s
      timeout: 30s
      retries: 3


